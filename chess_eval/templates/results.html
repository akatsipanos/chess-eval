<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="static/styles.css">
    <style>
        :root {
        --eval-bar: {{eval_bar}}%;
        }

        .sf_eval_bar {
            height: calc(50% - var(--eval-bar));
        }

    </style>
</head>
<body>
    <h1>Result</h1>
    <div class="results">
        <div class="prediction">
        <strong>Prediction</strong><br>{{ result }}
        </div>
        <div class="likelihood">
        <p><strong>Likelihood</strong><br>{{ result_str }}</p>
        </div>
    </div>
    <div class="chessboard">
        <img class="image">
            {{ svg_image | safe }}
        </img>
        <div class="bar">
             <div class="sf_eval_bar">{{ sf_eval }}</div>
        </div>
        <div class="bar">
             <div class="pred_eval_bar">{{ y_pred }}</div>
        </div>
    </div>
</body>
</html>
