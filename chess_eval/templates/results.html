<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <h1>Result</h1>
    <div class="results">
        <div class="prediction">
        <strong>Prediction</strong><br>{{ result }}
        </div>
        <div class="likelihood">
        <p><strong>Likelihood</strong><br>{{ result_str }}</p>
        </div>
    </div>
    <div class="chessboard">
        <div class="image">
            {{ svg_image | safe }}
        </div>
        <div class="eval-bar">
           {{ sf_eval }} {{ y_pred }}
        </div>
    </div>
</body>
</html>
